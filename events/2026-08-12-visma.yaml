talks:
  - speaker: Allan Nevala
    speaker_url: https://allannevala.com/
    title: Mistral LLM - Custom Benchmarks
    start: 2026-08-12 18:10
    end: 2026-08-12 18:40
    description: >-
      Allan shows his custom Mistral LLM benchmarks in Jupyter notebooks:
      the comparison methodology, the use of Pydantic AI, data
      visualisations, and how Mistral performed on various tasks relative
      to models from other providers such as Google and Anthropic. The
      results so far have been surprising.
  - speaker: Babäk Firoozi Fooladi
    speaker_url: https://babakfi.foo/
    title: What is a survival model?
    start: 2026-08-12 18:40
    end: 2026-08-12 19:10
    description: >-
      Ever heard of survival models, time-to-event models, or duration
      models? If not, join the meetup to get familiar.
  - speaker: Anna Korolyuk
    speaker_url: https://fi.linkedin.com/in/anna-korolyuk-892b1410
    title: Implementing Kalman filter in Python - from linear to non linear
    start: 2026-08-12 19:50
    end: 2026-08-12 20:30
    description: >-
      Kalman filters power sensor fusion in drones, fintech, and robotics.
      This talk walks through implementing them in Python, from the linear
      case to non-linear variants.
