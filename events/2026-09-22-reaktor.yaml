summary: >-
  An evening of talks at Reaktor: Jussi Pakkanen on building a super 8 film
  scanner at home, Alban King on an intuitive understanding of survival
  models, Aji Samudra on training a reinforcement learning agent to play the
  Pokémon Trading Card Game, and a lightning talk by Sajal Choudhary on how
  to learn using AI — plus snacks, drinks, networking, and the (in)famous
  PyData Helsinki quiz.

  Doors open at 17:30 and talks start at 18:00. Please arrive between those
  times; earlier than that you won't be able to get in. Registered attendees
  will receive an access code for the elevator. The entrance is at the corner
  of Yliopistonkatu and Fabianinkatu, marked with a Reaktor R logo. It is not
  the prominent Tiedekulma entrance.
